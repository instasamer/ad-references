<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Websites Paco - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #242736; --border: #2e3144;
      --text: #e4e4e7; --muted: #9ca3af;
      --primary: #6366f1; --primary-l: #818cf8;
      --green: #22c55e; --yellow: #eab308; --orange: #f97316; --red: #ef4444; --blue: #3b82f6;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    header h1 { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary-l), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.g { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.r { background: var(--red); }
    .badge-mode { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
    .badge-test { background: rgba(234,179,8,0.2); color: var(--yellow); }
    .badge-prod { background: rgba(34,197,94,0.2); color: var(--green); }
    main { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }

    /* Funnel */
    .funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; margin-bottom: 2rem; }
    .funnel-step { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; position: relative; }
    .funnel-step .num { font-size: 2rem; font-weight: 800; }
    .funnel-step .label { font-size: 0.7rem; color: var(--muted); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .funnel-step::after { content: '→'; position: absolute; right: -12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.2rem; }
    .funnel-step:last-child::after { display: none; }
    .c-green { color: var(--green); } .c-blue { color: var(--blue); } .c-yellow { color: var(--yellow); }
    .c-orange { color: var(--orange); } .c-red { color: var(--red); } .c-primary { color: var(--primary-l); }

    /* Actions */
    .actions { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    button { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
    button:hover { background: var(--surface2); border-color: var(--primary); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-l); }
    button.sm { padding: 0.3rem 0.6rem; font-size: 0.7rem; }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab { padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.85rem; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary-l); border-bottom-color: var(--primary); }

    /* Table */
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
    .panel-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 0.9rem; font-weight: 600; }
    .filters { display: flex; gap: 0.4rem; }
    .filters select, .filters input { padding: 0.35rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); color: var(--text); font-size: 0.75rem; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.6rem 1rem; font-size: 0.7rem; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    td { padding: 0.6rem 1rem; font-size: 0.8rem; border-bottom: 1px solid var(--border); }
    tr:hover { background: var(--surface2); }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
    .b-A { background: rgba(34,197,94,0.15); color: var(--green); }
    .b-B { background: rgba(59,130,246,0.15); color: var(--blue); }
    .b-C { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .b-D { background: rgba(239,68,68,0.15); color: var(--red); }
    .b-status { background: rgba(99,102,241,0.15); color: var(--primary-l); }
    .b-paid { background: rgba(34,197,94,0.15); color: var(--green); }
    a { color: var(--primary-l); text-decoration: none; } a:hover { text-decoration: underline; }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }

    /* Messages panel */
    .msg-list { max-height: 400px; overflow-y: auto; }
    .msg { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .msg .meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; }
    .msg.inbound { border-left: 3px solid var(--green); }
    .msg.outbound { border-left: 3px solid var(--primary); }
    .msg-text { word-break: break-word; }

    /* Invoice section */
    .invoice-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }

    @media (max-width: 768px) {
      main { padding: 1rem; }
      .funnel { grid-template-columns: repeat(3, 1fr); }
      .funnel-step::after { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Websites Paco · Málaga</h1>
    <div class="header-right">
      <span id="mode-badge"></span>
      <span><span class="dot" id="wa-dot"></span> <span id="wa-status">WhatsApp</span></span>
    </div>
  </header>

  <main>
    <!-- Sales Funnel -->
    <div class="funnel" id="funnel">
      <div class="funnel-step"><div class="num" id="f-total">-</div><div class="label">Scrapeados</div></div>
      <div class="funnel-step"><div class="num c-red" id="f-prospect">-</div><div class="label">Prospectos (C+D)</div></div>
      <div class="funnel-step"><div class="num c-primary" id="f-sites">-</div><div class="label">Webs generadas</div></div>
      <div class="funnel-step"><div class="num c-blue" id="f-contacted">-</div><div class="label">Contactados</div></div>
      <div class="funnel-step"><div class="num c-orange" id="f-interested">-</div><div class="label">Interesados</div></div>
      <div class="funnel-step"><div class="num c-green" id="f-paid">-</div><div class="label">Pagados</div></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="primary" onclick="run('run-pipeline')">Pipeline Completo</button>
      <button onclick="run('scrape')">1. Scrape</button>
      <button onclick="run('audit')">2. Auditar</button>
      <button onclick="run('photos')">3. Fotos</button>
      <button onclick="run('build-sites')">4. Generar webs</button>
      <button onclick="run('send-messages')">5. Enviar WhatsApp</button>
      <button onclick="run('follow-ups')">Follow-ups</button>
      <button onclick="run('connect-whatsapp')">Conectar WA</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="businesses" onclick="switchTab(this)">Negocios</div>
      <div class="tab" data-tab="messages" onclick="switchTab(this)">Mensajes</div>
      <div class="tab" data-tab="invoices" onclick="switchTab(this)">Facturación</div>
    </div>

    <!-- Businesses Tab -->
    <div class="tab-content" id="tab-businesses">
      <div class="panel">
        <div class="panel-header">
          <h2>Negocios (<span id="biz-count">0</span>)</h2>
          <div class="filters">
            <select id="f-grade" onchange="loadBiz()">
              <option value="">Grado</option>
              <option value="A">A</option><option value="B">B</option>
              <option value="C">C</option><option value="D">D</option>
            </select>
            <select id="f-status" onchange="loadBiz()">
              <option value="">Estado</option>
              <option value="scraped">Scraped</option>
              <option value="prospect">Prospecto</option>
              <option value="site_ready">Web lista</option>
              <option value="contacted">Contactado</option>
              <option value="interested">Interesado</option>
              <option value="deal_pending">Deal pendiente</option>
              <option value="proforma_sent">Proforma enviada</option>
              <option value="paid">Pagado</option>
              <option value="rejected">Rechazado</option>
              <option value="no_response">Sin respuesta</option>
              <option value="skipped">Descartado</option>
            </select>
            <input type="text" id="f-search" placeholder="Buscar..." oninput="loadBiz()">
          </div>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Rating</th><th>Grado</th><th>Estado</th><th>Web</th><th>WA</th><th>Acciones</th></tr></thead>
            <tbody id="biz-tbody"><tr><td colspan="8" class="empty">Cargando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Messages Tab -->
    <div class="tab-content" id="tab-messages" style="display:none">
      <div class="panel">
        <div class="panel-header"><h2>Conversaciones recientes</h2></div>
        <div class="msg-list" id="msg-list"></div>
      </div>
    </div>

    <!-- Invoices Tab -->
    <div class="tab-content" id="tab-invoices" style="display:none">
      <div class="panel">
        <div class="panel-header">
          <h2>Facturación</h2>
          <div>
            <span style="font-size:0.8rem;color:var(--muted)">Precio: <strong>200€</strong> | Early bird: <strong>150€</strong></span>
          </div>
        </div>
        <div id="invoice-list"></div>
      </div>
    </div>
  </main>

  <script>
    const API = location.origin + '/api';
    const esc = s => { const e = document.createElement('span'); e.textContent = s; return e.innerHTML; };

    // Tabs
    function switchTab(el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      el.classList.add('active');
      document.getElementById('tab-' + el.dataset.tab).style.display = 'block';
      if (el.dataset.tab === 'messages') loadMessages();
      if (el.dataset.tab === 'invoices') loadInvoices();
    }

    // Stats
    async function loadStats() {
      try {
        const d = await (await fetch(API + '/stats')).json();
        document.getElementById('f-total').textContent = d.total;
        const prospectCount = d.byGrade.filter(g => g.grade === 'C' || g.grade === 'D').reduce((s, g) => s + g.count, 0);
        document.getElementById('f-prospect').textContent = prospectCount;
        document.getElementById('f-sites').textContent = d.withSite;
        document.getElementById('f-contacted').textContent = d.contacted;
        document.getElementById('f-interested').textContent = d.interested;
        document.getElementById('f-paid').textContent = d.paid;

        const dot = document.getElementById('wa-dot');
        const st = document.getElementById('wa-status');
        dot.className = d.whatsapp.connected ? 'dot g' : 'dot r';
        st.textContent = d.whatsapp.connected ? 'Conectado' : 'Desconectado';

        const mb = document.getElementById('mode-badge');
        mb.className = 'badge-mode ' + (d.testMode ? 'badge-test' : 'badge-prod');
        mb.textContent = d.testMode ? `TEST (${d.batchSize})` : 'PRODUCCIÓN';
      } catch (e) { console.error(e); }
    }

    // Businesses
    async function loadBiz() {
      try {
        const p = new URLSearchParams();
        const g = document.getElementById('f-grade').value;
        const s = document.getElementById('f-status').value;
        const q = document.getElementById('f-search').value;
        if (g) p.set('grade', g); if (s) p.set('status', s); if (q) p.set('search', q);

        const d = await (await fetch(API + '/businesses?' + p)).json();
        document.getElementById('biz-count').textContent = d.total;
        const tb = document.getElementById('biz-tbody');

        if (d.businesses.length === 0) {
          tb.innerHTML = '<tr><td colspan="8" class="empty">Sin resultados</td></tr>';
          return;
        }

        tb.innerHTML = d.businesses.map(b => `<tr>
          <td><strong>${esc(b.name)}</strong><div style="font-size:0.7rem;color:var(--muted)">${esc(b.address || '')}</div></td>
          <td style="font-size:0.75rem">${esc(b.business_type || '-')}</td>
          <td>${b.rating ? b.rating + '<span style="color:var(--yellow)">★</span>' : '-'}</td>
          <td>${b.website_grade ? '<span class="badge b-' + b.website_grade + '">' + b.website_grade + '</span>' : '-'}</td>
          <td><span class="badge ${b.status === 'paid' ? 'b-paid' : 'b-status'}">${esc(b.status)}</span></td>
          <td>${b.generated_site_slug ? '<a href="/sites/' + b.generated_site_slug + '" target="_blank">Ver</a>' : '-'}</td>
          <td>${b.whatsapp_sent ? '✅' : (b.phone ? '📱' : '❌')}</td>
          <td>${b.status === 'interested' || b.status === 'deal_pending' ? '<button class="sm" onclick="genProforma(' + b.id + ')">Proforma</button>' : ''}</td>
        </tr>`).join('');
      } catch (e) { console.error(e); }
    }

    // Messages
    async function loadMessages() {
      try {
        const d = await (await fetch(API + '/stats')).json();
        const ml = document.getElementById('msg-list');
        if (!d.recentMessages.length) { ml.innerHTML = '<div class="empty">Sin mensajes</div>'; return; }
        ml.innerHTML = d.recentMessages.map(m => `<div class="msg ${m.direction}">
          <div class="meta">${esc(m.business_name)} · ${m.direction === 'inbound' ? '📥' : '📤'} · ${m.sent_at}</div>
          <div class="msg-text">${esc(m.message).slice(0, 200)}</div>
        </div>`).join('');
      } catch (e) { console.error(e); }
    }

    // Invoices
    async function loadInvoices() {
      try {
        const invoices = await (await fetch(API + '/invoices')).json();
        const il = document.getElementById('invoice-list');
        if (!invoices.length) { il.innerHTML = '<div class="empty">Sin facturas</div>'; return; }
        il.innerHTML = invoices.map(i => `<div class="invoice-row">
          <div><strong>${esc(i.invoice_number)}</strong> - ${esc(i.client_name)}<br><span style="font-size:0.7rem;color:var(--muted)">${esc(i.concept)}</span></div>
          <div style="text-align:right">
            <strong>${i.total_amount.toFixed(2)}€</strong><br>
            <span class="badge ${i.type === 'factura' ? 'b-paid' : 'b-status'}">${i.type}</span>
            ${i.type === 'proforma' && i.status !== 'converted' ? '<button class="sm" onclick="confirmPay(\'' + i.invoice_number + '\')">Confirmar pago</button>' : ''}
          </div>
        </div>`).join('');
      } catch (e) { console.error(e); }
    }

    // Actions
    async function run(name) {
      try {
        const r = await (await fetch(API + '/actions/' + name, { method: 'POST' })).json();
        alert(r.error || r.message || 'Iniciado');
      } catch (e) { alert('Error: ' + e.message); }
      setTimeout(() => { loadStats(); loadBiz(); }, 3000);
      setTimeout(() => { loadStats(); loadBiz(); }, 15000);
    }

    async function genProforma(bizId) {
      const name = prompt('Nombre del cliente (para proforma):');
      if (!name) return;
      const nif = prompt('NIF/CIF (opcional):') || '';
      try {
        const r = await (await fetch(API + '/invoices/proforma', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ businessId: bizId, clientName: name, clientNif: nif })
        })).json();
        alert('Proforma generada: ' + r.invoiceNumber + ' (' + r.totalAmount.toFixed(2) + '€)');
        loadInvoices();
      } catch (e) { alert('Error: ' + e.message); }
    }

    async function confirmPay(proformaNum) {
      if (!confirm('¿Confirmar pago recibido para ' + proformaNum + '?')) return;
      try {
        const r = await (await fetch(API + '/invoices/confirm-payment', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proformaNumber: proformaNum })
        })).json();
        alert('Factura generada: ' + r.facturaNumber);
        loadInvoices(); loadStats(); loadBiz();
      } catch (e) { alert('Error: ' + e.message); }
    }

    // Init
    loadStats(); loadBiz();
    setInterval(() => { loadStats(); loadBiz(); }, 30000);
  </script>
</body>
</html>
